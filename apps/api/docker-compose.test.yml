name: lead-connect-tests
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: leadconnect
      POSTGRES_DB: leadconnect_test
      # Disposable local testing only; never expose this service publicly.
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/test-data
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadconnect -d leadconnect_test"]
      interval: 2s
      timeout: 5s
      retries: 15
